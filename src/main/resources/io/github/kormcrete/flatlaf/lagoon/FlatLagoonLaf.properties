# FlatLagoonLaf: a classic light theme for FlatLaf, loaded for the class of the same name.
# Key reference: https://www.formdev.com/flatlaf/properties-files/
#
# Layout and sizes are FlatLaf Light's (paddings, row heights, fonts, message layout, trees), the look is
# Lagoon's own: square-ish frames in an etched ring, raised buttons, framed card tabs, a table grid, blue
# scroll bars with buttons.
#
# Palette: control / panel / menubar / header @background (#F2F2F2, FlatLaf Light's grey), highlight #F7F8F8,
# shadow #DBDCDC, dark shadow and table grid #BCBDBE, component frame #5F6265, text #000000 on #FFFFFF,
# disabled text #8C9298, selection #2A80D9 on white (#B2D8FF on black without focus), focus #2A80D9,
# tree lines #6CAAD6, scroll thumb and progress #7CB2EB.
#
# The font is the platform's, as in FlatLaf Light. A denser application can turn on the switches marked
# "Lagoon.*" below in its own FlatLagoonLaf.properties (FlatLaf.registerCustomDefaultsSource).

#---- base variables ---------------------------------------------------------
@background = #F2F2F2
@foreground = #000000
@componentBackground = #FFFFFF
@textComponentBackground = #FFFFFF
@menuBackground = #FCFCFD
# Selected rows: the accent with white text while the table, list or tree has the focus, a pale blue without.
@selectionBackground = #2A80D9
@selectionForeground = #FFFFFF
@selectionInactiveBackground = #B2D8FF
@selectionInactiveForeground = #000000
# Menus keep the pale selection.
@menuSelectionBackground = #B2D8FF
@menuAcceleratorSelectionForeground = #000000
@disabledForeground = #8C9298
@disabledBackground = @background
@cellFocusColor = darken(@selectionBackground,20%)

#---- fonts: the platform's (FlatLaf's), menus and toolbar regular as in Light; frame titles are bold ----
# Switch: true bases the fonts on Dialog 12 instead (FlatLagoonLaf picks it in Java, so FlatLaf still scales it).
Lagoon.dialogFont = false
InternalFrame.titleFont = bold

#---- shapes: 1px dark frame in a 1px light ring ----------------------------
CheckBox.arc = 0
ProgressBar.arc = 0
Component.borderWidth = 1
Component.borderColor = #5F6265
# Disabled fields keep a visible frame: they often show read-only values.
Component.disabledBorderColor = #8C9298
# The dark frame sits in a 1px etched ring (LagoonBorders): shadow above and left, highlight below
# and right. A focused field, combo box or spinner keeps the ring; its frame turns the focus colour and
# thickens inwards by Component.innerFocusWidth.
Component.focusWidth = 1
Component.ringShadowColor = #DBDCDC
Component.ringHighlightColor = #F7F8F8
# Fields, combos and spinners take the width their content asks for; no 64px floor.
Component.minimumWidth = 0
# Combo box and spinner arrows are FlatLaf's chevrons. Switch: true gives them small raised buttons with a
# solid triangle (LagoonArrowButton), as the scroll bars have; pair it with ComboBox.buttonStyle and
# Spinner.buttonStyle = none and Component.arrowType = triangle.
Lagoon.raisedArrowButtons = false
Component.innerFocusWidth = 1
Component.focusColor = #2A80D9
Component.focusedBorderColor = $Component.focusColor
# Corners rounded just enough to soften them; buttons more.
Component.arc = 2
TextComponent.arc = 2
Button.arc = 5
Component.error.borderColor = #D9534F
Component.warning.borderColor = #E0A800
# Links (HTML <a> in labels, and SwingX hyperlinks through it): a clear, saturated blue.
Component.linkColor = #0033CC

#---- buttons ----------------------------------------------------------------
# Switches: true keeps the icon-text gap after a label's or button's text (table cells and tree rows
# included), and gives buttons an odd width and height (CompoundSize).
Lagoon.labelGap = false
Lagoon.oddButtonSize = false
# The raised face of buttons and arrow buttons (LagoonSheen): light top, middle tone, darker foot.
Lagoon.sheen.top = #FFFFFF
Lagoon.sheen.middle = #EEF1F4
Lagoon.sheen.bottom = #DCE1E6
Lagoon.sheen.highlight = #FFFFFF
Lagoon.sheen.pressedTop = #D3D9DF
Lagoon.sheen.pressedMiddle = #DFE4E9
Lagoon.sheen.pressedBottom = #EBEEF1
Button.background = @background
Button.foreground = #000000
Button.borderColor = #5F6265
Button.disabledBorderColor = #8C9298
Button.disabledBackground = @background
Button.disabledText = #8C9298
Button.hoverBackground = #FFFFFF
Button.hoverBorderColor = #2A80D9
Button.pressedBackground = #DCE0E4
Button.focusedBorderColor = #2A80D9
# No focus fill on buttons; FlatLaf tints focused buttons blue by default.
Button.focusedBackground = #FFFFFF
# Margin: FlatLaf's (2,14,2,14).
Button.minimumWidth = 0
Button.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Button
ToggleButton.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Button
Button.default.background = @background
Button.default.foreground = #000000
Button.default.borderColor = #5F6265
# The default button is framed in one line, like the others.
Button.default.borderWidth = 1
Button.default.hoverBackground = #FFFFFF
Button.default.focusedBorderColor = #2A80D9
Button.default.focusedBackground = #FFFFFF
Button.default.boldText = false
ToggleButton.selectedBackground = #DCE0E4
ToggleButton.focusedBackground = #FFFFFF
ToggleButton.selectedForeground = #000000
ToggleButton.toolbar.selectedBackground = #DCE0E4
# Toolbar buttons: a light hover, the menu bar's and tabs' (FlatLaf's darkens the button by 12%), pressed as a button.
Button.toolbar.hoverBackground = #E9EBED
Button.toolbar.pressedBackground = #DCE0E4

#---- check / radio ----------------------------------------------------------
# Margins: FlatLaf's (2,2,2,2).
# 12px check boxes and radio buttons, their frame filling the icon.
CheckBox.icon = io.github.kormcrete.flatlaf.lagoon.LagoonCheckBoxIcon
RadioButton.icon = io.github.kormcrete.flatlaf.lagoon.LagoonRadioButtonIcon
CheckBox.icon.background = #FFFFFF
CheckBox.icon.borderColor = #5F6265
CheckBox.icon.selectedBackground = #FFFFFF
CheckBox.icon.selectedBorderColor = #5F6265
CheckBox.icon.checkmarkColor = #2A80D9
CheckBox.icon.focusedBorderColor = #2A80D9
CheckBox.icon.hoverBorderColor = #2A80D9
CheckBox.icon.hoverBackground = #FFFFFF
CheckBox.icon.pressedBackground = #E8EBEF
CheckBox.icon.disabledBackground = @background
CheckBox.icon.disabledBorderColor = #BCBDBE
CheckBox.icon.disabledCheckmarkColor = #8C9298
CheckBox.icon.focusWidth = 0

#---- text components ----------------------------------------------------------
TextField.background = #FFFFFF
TextField.inactiveBackground = @background
TextField.disabledBackground = @background
TextField.inactiveForeground = #8C9298
TextComponent.selectionBackground = #B2D8FF
TextComponent.selectionForeground = #000000
# Margins: FlatLaf's (2,6,2,6 for fields and text areas).
TextField.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Text
FormattedTextField.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Text
PasswordField.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Text

#---- combo / spinner ----------------------------------------------------------
# A drop-down list reads as a control, an editable combo as a field.
ComboBox.background = @background
ComboBox.editableBackground = #FFFFFF
ComboBox.buttonBackground = @background
ComboBox.buttonEditableBackground = @background
ComboBox.buttonSeparatorColor = #5F6265
ComboBox.buttonDisabledSeparatorColor = #BCBDBE
ComboBox.buttonArrowColor = #535658
ComboBox.buttonDisabledArrowColor = #8C9298
ComboBox.buttonHoverArrowColor = #2A80D9
ComboBox.buttonPressedArrowColor = #2A80D9
# Padding: FlatLaf's. LagoonComboBoxUI pads an editable box's text field by ComboBox.editorMargins when set.
# as wide as its longest item, however short (FlatLaf keeps a combo box at least 72px)
ComboBox.minimumWidth = 0
ComboBox.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Round
ComboBox.popupBackground = #FFFFFF
Spinner.background = #FFFFFF
Spinner.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$Round
Spinner.buttonBackground = @background
Spinner.buttonSeparatorColor = #5F6265
Spinner.buttonArrowColor = #535658
Spinner.buttonDisabledArrowColor = #8C9298
Spinner.buttonHoverArrowColor = #2A80D9

#---- tabs: framed cards on a framed content area ------------------------------
TabbedPane.tabType = card
TabbedPane.cardTabArc = 0
TabbedPane.background = @background
TabbedPane.selectedBackground = @background
TabbedPane.hoverColor = #E9EBED
TabbedPane.focusColor = @background
TabbedPane.contentAreaColor = #8C9298
TabbedPane.showContentSeparator = true
# One line between the tabs and their content; the content's own frames are the only boxes inside
# (true frames the whole content area).
TabbedPane.hasFullBorder = false
TabbedPane.contentSeparatorHeight = 1
# LagoonTabbedPaneUI: room inside the content frame, given for tabs on top (top = the tab side).
TabbedPane.contentMargins = 1,2,2,2
TabbedPane.tabSelectionHeight = 0
TabbedPane.cardTabSelectionHeight = 0
TabbedPane.showTabSeparators = false
# LagoonTabbedPaneUI: frame and shade of the unselected tabs.
TabbedPane.unselectedBorderColor = #BCBDBE
TabbedPane.unselectedBottomColor = #DDE0E3
# LagoonTabbedPaneUI: how far the selected tab stands above the unselected ones (pixels), so it is easy to spot.
TabbedPane.selectedTabRaise = 2
# Tab height, tab insets and tab area insets: FlatLaf's (32; 4,12,4,12; 0,0,0,0).
TabbedPane.underlineColor = #8C9298
TabbedPane.inactiveUnderlineColor = #8C9298

#---- tables / lists / trees ------------------------------------------------------
Table.background = #FFFFFF
Table.foreground = #000000
Table.gridColor = #BCBDBE
Table.showHorizontalLines = true
Table.showVerticalLines = true
Table.intercellSpacing = 1,1
# LagoonTableUI: a selected cell keeps its own (row or column) colour, made more vivid, instead of the flat selection.
Table.selectionFollowsCellColor = true
# Row height and cell margins: FlatLaf's (20, 2,3,2,3).
TableHeader.background = @background
TableHeader.foreground = #000000
TableHeader.separatorColor = #8C9298
TableHeader.bottomSeparatorColor = #5F6265
TableHeader.hoverBackground = #FFFFFF
TableHeader.pressedBackground = #E6EAEE
# Height and cell margins: FlatLaf's (25, 2,3,2,3); LagoonTableHeaderUI takes the height as a minimum.
TableHeader.sortIconColor = #535658
List.background = #FFFFFF
Tree.background = #FFFFFF
# Lines (Tree.paintLines), default icons, rows and indents: FlatLaf's.
Tree.hash = #6CAAD6
Viewport.background = #FFFFFF
ScrollPane.background = #FFFFFF
ScrollPane.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$ScrollPane
# Around a table, list, tree or panel: the line a tab's content is framed in. Around text: the field's frame.
ScrollPane.borderColor = $TabbedPane.contentAreaColor
# A table swaps its scroll pane's border for this one; FlatLaf's own would ring a focused table.
Table.scrollPaneBorder = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$ScrollPane
# The vertical scroll bar starts below a column header; the corner beside the header stays free.
ScrollPane.fillUpperCorner = false

#---- scroll bars / progress: blue, with buttons --------------------------------
# LagoonScrollBarUI: 15px of buttons, track and thumb, plus the line towards the content.
ScrollBar.width = 16
ScrollBar.showButtons = true
ScrollBar.thumbArc = 0
ScrollBar.trackArc = 0
ScrollBar.thumbInsets = 0,0,0,0
ScrollBar.trackInsets = 0,0,0,0
ScrollBar.track = @background
ScrollBar.hoverTrackColor = @background
# The thumb is light at rest and deepens when the mouse is anywhere on the bar, and again while it is dragged;
# its frame and grip follow (LagoonScrollBarUI).
ScrollBar.hoverThumbWithTrack = true
ScrollBar.pressedThumbWithTrack = true
ScrollBar.thumb = #B2D8FF
ScrollBar.hoverThumbColor = #7CB2EB
ScrollBar.pressedThumbColor = #6D9CCE
ScrollBar.buttonArrowColor = #535658
ScrollBar.buttonDisabledArrowColor = #BCBDBE
ScrollBar.hoverButtonBackground = #FFFFFF
ScrollBar.pressedButtonBackground = #DCE0E4
ScrollBar.minimumThumbSize = 15,15
ScrollBar.lineColor = #BCBDBE
ScrollBar.thumbBorderColor = #86AEDB
ScrollBar.hoverThumbBorderColor = #5B8BC0
ScrollBar.pressedThumbBorderColor = #4F7DB0
# The thumb's grip: three raised ridges across its middle.
ScrollBar.gripHighlightColor = #E4F0FC
ScrollBar.gripShadowColor = #7DA4D1
ScrollBar.hoverGripShadowColor = #4A7AB0
ScrollBar.pressedGripShadowColor = #3F6A9A
# A grey track and an accent bar, as in FlatLaf Light. LagoonProgressBarUI frames the track and the bar when
# ProgressBar.borderColor / ProgressBar.barBorderColor are set (with a ProgressBar.border leaving room for them).
ProgressBar.background = darken(@background,10%)
ProgressBar.foreground = #2A80D9
# The percentage text, over the track and over the bar.
ProgressBar.selectionBackground = #404448
ProgressBar.selectionForeground = #404448
# Sizes: FlatLaf's (146,4 and 4,146).
Slider.trackColor = #DBDCDC
Slider.thumbColor = #7CB2EB
Slider.trackValueColor = #7CB2EB
Slider.focusedColor = #2A80D900

#---- menus / toolbar / tooltip ---------------------------------------------------
MenuBar.background = @background
MenuBar.borderColor = #DBDCDC
MenuBar.hoverBackground = #E9EBED
MenuBar.selectionBackground = #B2D8FF
MenuBar.selectionForeground = #000000
# LagoonBorders$MenuItem: the frame round a menu bar's open menu.
MenuBar.selectionBorderColor = #2A80D9
# LagoonBorders$MenuBar: room before the first item; items 22px with the line, text a little low.
MenuBar.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$MenuBar
MenuBar.padding = 0,2,0,0
MenuBar.itemMargins = 5,8,2,7
Menu.background = #FCFCFD
Menu.selectionBackground = #B2D8FF
Menu.selectionForeground = #000000
MenuItem.background = #FCFCFD
MenuItem.selectionBackground = #B2D8FF
MenuItem.selectionForeground = #000000
MenuItem.selectionArc = 0
MenuItem.selectionInsets = 0,0,0,0
# Dense popup menus: items 19px, 21px with an icon or a check mark; LagoonBorders$MenuItem sets the left side
# from textInset / iconInset, so the text of all items of a popup lines up.
MenuItem.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$MenuItem
Menu.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$MenuItem
CheckBoxMenuItem.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$MenuItem
RadioButtonMenuItem.border = io.github.kormcrete.flatlaf.lagoon.LagoonBorders$MenuItem
MenuItem.margin = 2,4,2,7
Menu.margin = 3,4,3,5
CheckBoxMenuItem.margin = 3,4,3,6
RadioButtonMenuItem.margin = 3,4,3,6
MenuItem.textInset = 21
MenuItem.iconInset = 21
MenuItem.minimumIconSize = 0,0
MenuItem.iconTextGap = 4
MenuItem.textAcceleratorGap = 4
MenuItem.textNoAcceleratorGap = 2
PopupMenuSeparator.height = 3
PopupMenuSeparator.stripeIndent = 1
CheckBoxMenuItem.selectionBackground = #B2D8FF
RadioButtonMenuItem.selectionBackground = #B2D8FF
PopupMenu.background = #FCFCFD
# Square popups like every other corner here, framed in PopupMenu.borderColor. Where the platform draws the popup
# window's border (macOS, Windows 11) it takes that colour at this width; FlatLaf's 0 on macOS left only the
# system's faint edge. Combo box lists and tooltips follow.
Popup.borderCornerRadius = 0
Popup.roundedBorderWidth = 1
[mac]Popup.roundedBorderWidth = 1
PopupMenu.borderColor = #5F6265
PopupMenu.borderInsets = 2,2,2,2
Separator.foreground = #DBDCDC
Separator.background = #F7F8F8
ToolBar.background = @background
ToolBar.separatorColor = #BCBDBE
# LagoonToolBarSeparatorUI: the separator's width, and its line's length plus 2px at each end.
ToolBar.separatorWidth = 16
ToolBar.separatorLength = 12
ToolBar.gripColor = #8C9298
ToolBar.borderMargins = 1,3,1,3
ToolTip.background = #B2D8FF
ToolTip.foreground = #000000
ToolTip.border = 1,3,1,3,#000000

#---- panels, frames, split panes ------------------------------------------------
Panel.background = @background
Label.foreground = #000000
Label.disabledForeground = #8C9298
TitledBorder.titleColor = #000000
SplitPane.dividerSize = 6
SplitPaneDivider.style = grip
SplitPaneDivider.gripColor = #8C9298
SplitPaneDivider.oneTouchArrowColor = #535658
InternalFrame.activeTitleBackground = #A1CEF4
InternalFrame.activeTitleForeground = #000000
InternalFrame.inactiveTitleBackground = #CEDFEE
InternalFrame.inactiveTitleForeground = #000000
InternalFrame.activeBorderColor = #5F6265
InternalFrame.inactiveBorderColor = #8C9298
InternalFrame.borderLineWidth = 1
InternalFrame.borderMargins = 2,5,5,5
InternalFrame.buttonHoverBackground = #FFFFFF
InternalFrame.buttonPressedBackground = #DCE0E4
Desktop.background = #B8C4CE
OptionPane.background = @background
# Message layout: FlatLaf's (buttons in the platform's order and place, the same size, lines wrapped).
