# A dense, classic application's look on top of Lagoon's defaults, as FlatLaf custom defaults
# (FlatLaf.registerCustomDefaultsSource("io.github.kormcrete.flatlaf.lagoon.dense")): every switch on, and the
# sizes, palette, trees and message layout Lagoon had before its defaults became FlatLaf Light's. The tests
# use it to check that an application can keep that look with keys alone.

#---- switches for behaviour Lagoon has in Java ------------------------------------
# Fonts based on Dialog 12, not the platform's UI font.
Lagoon.dialogFont = true
# The icon-text gap kept after a label's, table cell's, tree row's and button's text; odd button sizes.
Lagoon.labelGap = true
Lagoon.oddButtonSize = true
# Small raised arrow buttons with a solid triangle on combo boxes and spinners, instead of FlatLaf's band.
Lagoon.raisedArrowButtons = true
ComboBox.buttonStyle = none
Spinner.buttonStyle = none
Component.arrowType = triangle

#---- palette ---------------------------------------------------------------------------
@background = #F5F6F7
# One pale selection colour whether or not the table, list or tree has the focus.
@selectionBackground = #B2D8FF
@selectionForeground = #000000
@cellFocusColor = #2A80D9
Table.focusCellBackground = #B2D8FF

#---- focus: a focused field keeps its dark one-pixel frame ------------------------------------
Component.innerFocusWidth = 0
Component.focusedBorderColor = #5F6265

#---- dense sizes -------------------------------------------------------------------------
# 21px single-line fields: ring, frame, then 1px.
TextField.margin = 1,1,1,1
FormattedTextField.margin = 1,1,1,1
PasswordField.margin = 1,1,1,1
# Text areas: the text starts right inside the frame, so n rows are n lines high.
TextArea.margin = 0,0,0,0
# 23px combo boxes. A list value's text 1px further in than a field's (its renderer adds a 1px border); an
# editable box's text where a field's text is.
ComboBox.padding = 2,2,2,4
ComboBox.editorMargins = 2,1,2,3
# 24px spinners.
Spinner.padding = 2,1,3,2
Table.rowHeight = 16
# Must stay 1,1,1,1: renderers using Swing's static noFocusBorder (1,1,1,1) would jump on focus.
Table.cellMargins = 1,1,1,1
# Headers as tall as their text.
TableHeader.height = 0
TableHeader.cellMargins = 1,3,1,3
# 25px buttons with the text: ring, frame, then the margin.
Button.margin = 3,14,3,14
CheckBox.margin = 4,5,4,5
RadioButton.margin = 4,5,4,5
ProgressBar.horizontalSize = 146,16

#---- tabs: the whole content area framed ---------------------------------------------------
TabbedPane.hasFullBorder = true
TabbedPane.tabHeight = 20
TabbedPane.tabInsets = 2,10,3,11
TabbedPane.tabAreaInsets = 1,2,0,0

#---- trees: lines and default icons; rows as tall as their icon or text, flush at the tree's edge, 20px
#---- further in per level -------------------------------------------------------------------
Tree.paintLines = true
Tree.showDefaultIcons = true
Tree.border = 0,0,0,0
Tree.rendererMargins = 0,0,0,0
Tree.rightChildIndent = 13

#---- message dialogs: classic layout -----------------------------------------------------------
# Buttons centred, Yes first (on every platform), sized to the widest label with the classic narrow margin,
# no minimum width; lines are not wrapped.
OptionPane.border = 10,10,12,10
OptionPane.buttonAreaBorder = 6,0,0,0
OptionPane.iconMessageGap = 15
OptionPane.buttonOrientation = 0
OptionPane.isYesLast = false
[mac]OptionPane.isYesLast = false
OptionPane.buttonMinimumWidth = -1
OptionPane.setButtonMargin = true
OptionPane.maxCharactersPerLine = 0
